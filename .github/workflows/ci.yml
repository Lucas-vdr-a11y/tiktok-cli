name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Syntax-check all sources
        run: |
          for f in src/*.js bin/*.js scripts/*.js; do
            node --check "$f" || exit 1
          done
          echo "syntax OK"

      - name: Unit tests
        run: npm test

      - name: CLI smoke test (--help)
        run: node bin/captron.js --help > /dev/null

      - name: CLI smoke test (doctor, no login expected)
        run: node bin/captron.js doctor
